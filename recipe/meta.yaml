{% set name = "ipyaladin" %}
{% set version = "0.8.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ipyaladin-{{ version }}.tar.gz
  sha256: 43d7c55e8e4ec987f6045c1e1616e5b3dff6ad9fd069a586646e74f95a3fb427

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-jupyter-builder >=0.5.0
    - pip
  run:
    - python >={{ python_min }}
    - anywidget
    - astropy-base
    - astroquery

test:
  imports:
    - ipyaladin
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  home: https://github.com/cds-astro/ipyaladin
  summary: ipyaladin
  description: ipyaladin, a Jupyter widget for Aladin Lite, the sky viewer
  doc_url: https://cds-astro.github.io/ipyaladin/
  dev_url: https://github.com/cds-astro/ipyaladin

extra:
  recipe-maintainers:
    - ManonMarchand
    - bmatthieu3
    - tboch
