{% set name = "ipyaladin" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ipyaladin-{{ version }}.tar.gz
  sha256: be054a2d8eb8cba3a4501a05be8549ea44c9e1025e6df0c7a185e41e744487c4

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python >=3.8
    - hatchling
    - hatch-jupyter-builder >=0.5.0
    - pip
  run:
    - python >=3.8
    - anywidget
    - astropy-base
    - astroquery

test:
  imports:
    - ipyaladin
  commands:
    - pip check
  requires:
    - pip

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  home: https://github.com/cds-astro/ipyaladin
  summary: ipyaladin
  description: ipyaladin, a Jupyter widget for Aladin Lite, the sky viewer
  doc_url: https://cds-astro.github.io/ipyaladin/
  dev_url: https://github.com/cds-astro/ipyaladin

extra:
  recipe-maintainers:
    - ManonMarchand
    - bmatthieu3
    - tboch
